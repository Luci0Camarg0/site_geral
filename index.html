<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cofre de Beats</title>
<meta name="description" content="Instrumentais de rap com capa, BPM e player.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cofre de <span>Beats</span></h1>
      <p class="sub">Instrumentais de rap, prontos pra escutar.</p>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" class="search" type="search" placeholder="Buscar por nome, tom ou tag" aria-label="Buscar beats">
    <select id="sort" class="sel" aria-label="Ordenar">
      <option value="date-desc">Mais recentes</option>
      <option value="date-asc">Mais antigos</option>
      <option value="name-asc">Nome (A–Z)</option>
      <option value="name-desc">Nome (Z–A)</option>
      <option value="bpm-asc">BPM (menor primeiro)</option>
      <option value="bpm-desc">BPM (maior primeiro)</option>
      <option value="dur-desc">Duração (maior primeiro)</option>
    </select>
    <div class="seg" role="group" aria-label="Visualização">
      <button id="vGrid" aria-pressed="true">Capas</button>
      <button id="vList" aria-pressed="false">Lista</button>
    </div>
  </div>
  <div class="tags" id="tags"></div>
  <div class="count mono" id="count"></div>
  <main id="out"></main>
</div>

<div class="player" id="player">
  <div class="in">
    <div class="now" id="now"><div class="t"><p class="name" style="color:var(--muted);font-weight:500">Escolha um beat pra tocar</p></div></div>
    <div class="ctl">
      <button class="icon" id="prev" aria-label="Anterior"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="icon big" id="pp" aria-label="Tocar"><svg id="ppIcon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4v16l13-8z"/></svg></button>
      <button class="icon" id="next" aria-label="Próximo"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="seek">
      <span class="mono" id="cur">0:00</span>
      <input type="range" id="bar" min="0" max="1000" value="0" aria-label="Posição">
      <span class="mono" id="tot">0:00</span>
    </div>
    <div class="volwrap ctl">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/></svg>
      <input type="range" id="vol" class="vol" min="0" max="100" value="85" aria-label="Volume">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
